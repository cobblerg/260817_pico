<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🫐 피코 시뮬레이터</title>
<style>
  :root {
    --bg: #f4f5fb;
    --panel: #ffffff;
    --border: #dfe2ee;
    --text: #1e2233;
    --muted: #6b7186;
    --accent: #6d5bd0;
    --accent-dark: #5645b5;
    --danger: #d84f4f;
    --ok: #2fa66a;
    --console-bg: #171a24;
    --console-text: #d7ffe0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header.app-header {
    text-align: center;
    padding: 18px 12px 10px;
  }
  header.app-header h1 { margin: 0; font-size: 1.6rem; }
  header.app-header p { margin: 4px 0 0; color: var(--muted); font-size: 0.95rem; }

  /* stage tabs */
  .stage-tabs {
    max-width: 1300px;
    margin: 0 auto 10px;
    padding: 0 14px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .stage-tab {
    flex: 1;
    min-width: 150px;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--muted);
    text-align: center;
  }
  .stage-tab.active { background: var(--accent); border-color: var(--accent-dark); color: #fff; }
  .stage-tab:hover:not(.active) { background: #f1f0ff; }

  main.workspace {
    display: grid;
    grid-template-columns: 220px minmax(340px, 1.2fr) minmax(320px, 1fr);
    gap: 12px;
    padding: 0 14px;
    max-width: 1300px;
    margin: 0 auto;
  }
  @media (max-width: 900px) {
    main.workspace { grid-template-columns: 1fr; }
  }

  section.panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    min-height: 560px;
  }
  section.panel h2 {
    margin: 0 0 10px;
    font-size: 0.95rem;
    color: var(--muted);
    font-weight: 600;
  }

  /* palette */
  .palette-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 10px 8px;
    border: 1px dashed var(--border);
    border-radius: 10px;
    cursor: grab;
    user-select: none;
    touch-action: none;
    background: #faf9ff;
    margin-bottom: 8px;
  }
  .palette-item:active { cursor: grabbing; }
  .palette-icon-svg { width: 34px; height: 40px; overflow: visible; }
  .privacy-note {
    font-size: 0.72rem;
    color: var(--danger);
    line-height: 1.4;
    padding-top: 6px;
    margin-bottom: 4px;
  }

  #palettePanel { overflow-y: auto; }
  .mission-box {
    background: #fff8e6;
    border: 1px dashed #e8b93f;
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 12px;
  }
  .mission-title { font-weight: 700; color: #a5690a; margin-bottom: 4px; font-size: 0.82rem; }
  .mission-text { font-size: 0.74rem; color: #6b5a2a; line-height: 1.55; margin: 0; }
  .blocks-heading { margin: 14px 0 8px; font-size: 0.82rem; color: var(--muted); font-weight: 600; }
  .code-blocks { display: flex; flex-direction: column; gap: 6px; }
  .code-block {
    padding: 7px 10px;
    border-radius: 8px;
    background: #eef0ff;
    border: 1px solid #cfd3f5;
    font-family: "Consolas", monospace;
    font-size: 0.7rem;
    color: #3d3a6b;
    cursor: grab;
    user-select: none;
    touch-action: none;
  }
  .code-block:active { cursor: grabbing; }
  #codeEditor.drop-hover { outline: 2px dashed var(--accent); outline-offset: -2px; }

  /* board canvas */
  #boardCanvas {
    position: relative;
    flex: 1;
    background: #eef0fa;
    background-image: radial-gradient(#dde1f2 1px, transparent 1px);
    background-size: 16px 16px;
    border-radius: 10px;
    overflow: hidden;
    min-height: 640px;
  }
  #wireLayer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }

  /* ---- realistic Pico WH board ---- */
  .pico-board-wrap { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); display: flex; align-items: stretch; }
  .pico-board { cursor: grab; }
  .pico-board:active { cursor: grabbing; }
  .pico-pins-col { display: flex; flex-direction: column; justify-content: space-between; padding: 18px 0; z-index: 2; }
  .pico-pins-col.left { margin-right: -7px; }
  .pico-pins-col.right { margin-left: -7px; }
  .pin-wrap { display: flex; align-items: center; gap: 3px; height: 13px; }
  .pico-pins-col.right .pin-wrap { flex-direction: row-reverse; }
  .pin-label { font-size: 0.46rem; color: var(--muted); white-space: nowrap; }
  .pin {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: linear-gradient(#f5d992, #c9982f);
    border: 1px solid #8a6a1c;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform 0.1s, background 0.15s;
  }
  .pin:hover { transform: scale(1.3); }
  .pin.connected { background: var(--ok); border-color: #1f7a4c; }
  .pin.reject { background: var(--danger) !important; border-color: #7a1f1f !important; }

  .pico-board {
    position: relative;
    width: 172px;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 8px),
      linear-gradient(160deg, #1c7d4c, #124327);
    border: 2px solid #0e3520;
    border-radius: 6px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
    padding: 10px 8px;
  }
  .pico-hole {
    position: absolute; width: 8px; height: 8px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #fafafa, #cfd2d8 55%, #8d939e);
    border: 1px solid #5b616c;
  }
  .pico-hole.tl { top: 6px; left: 6px; }
  .pico-hole.tr { top: 6px; right: 6px; }
  .pico-hole.bl { bottom: 6px; left: 6px; }
  .pico-hole.br { bottom: 6px; right: 6px; }
  .pico-usb {
    position: relative; width: 34px; height: 24px;
    background: linear-gradient(#3d3e44, #131316);
    border: 1px solid #050506; border-radius: 3px; margin: 4px auto 6px;
  }
  .pico-usb::after {
    content: ""; position: absolute; top: 4px; left: 4px; right: 4px; bottom: 4px;
    background: linear-gradient(#d3d7e0, #9aa0ab); border-radius: 1px;
  }
  .pico-chip {
    width: 46px; height: 46px;
    background: linear-gradient(155deg, #2b2c31, #0a0a0b);
    border-radius: 3px; margin: 8px auto 6px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06), 0 1px 2px rgba(0,0,0,0.4);
  }
  .pico-chip-logo { width: 20px; height: 20px; opacity: 0.9; }
  .pico-row { display: flex; align-items: flex-end; justify-content: center; gap: 10px; margin: 6px auto 2px; }
  .pico-boot {
    width: 15px; height: 15px;
    background: linear-gradient(#fbfaf2, #ddd8c4);
    border: 1px solid #9b9680; border-radius: 2px;
    box-shadow: 0 1px 1px rgba(0,0,0,0.35);
  }
  .pico-debug { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .pico-debug-label { font-size: 0.38rem; color: rgba(255,255,255,0.5); letter-spacing: 0.5px; }
  .pico-debug-pins { display: flex; gap: 2px; }
  .pico-debug-pins span {
    width: 5px; height: 8px;
    background: linear-gradient(#f5d992, #c9982f);
    border: 1px solid #8a6a1c; border-radius: 1px; display: block;
  }
  .pico-wifi {
    position: relative; width: 58px; height: 44px;
    background: linear-gradient(135deg, #eef0f4, #b7bcc6 55%, #8a90a0);
    border: 1px solid #63697a; border-radius: 2px; margin: 6px auto 2px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.35);
  }
  .pico-wifi::before, .pico-wifi::after { content: ""; position: absolute; top: 3px; bottom: 3px; width: 1px; background: rgba(0,0,0,0.15); }
  .pico-wifi::before { left: 33%; }
  .pico-wifi::after { left: 66%; }
  .pico-wifi-label { text-align: center; font-size: 0.42rem; color: rgba(255,255,255,0.5); letter-spacing: 0.5px; margin-top: 2px; }
  .pico-title {
    position: absolute; top: 50%; left: 3px; transform: translateY(-50%) rotate(180deg);
    writing-mode: vertical-rl; font-size: 0.5rem; color: rgba(255,255,255,0.55); letter-spacing: 1px; font-weight: 600;
  }

  /* ---- placed components (LED / button / buzzer) ---- */
  .component { position: absolute; touch-action: none; z-index: 3; }
  .comp-svg { cursor: default; touch-action: none; transform-origin: 50% 50%; }
  .comp-svg.movable { cursor: grab; }
  .comp-svg.movable:active { cursor: grabbing; }
  .comp-svg .led-dome { fill: url(#ledGradOff); stroke: #6b1f1f; stroke-width: 1.5; transition: fill 0.1s; }
  .led-component.on .comp-svg .led-dome { fill: url(#ledGradOn); filter: drop-shadow(0 0 8px rgba(255,90,40,0.95)) drop-shadow(0 0 16px rgba(255,150,40,0.6)); }
  .comp-svg .led-base { fill: #9a9ba3; }
  .comp-svg .part-leg { stroke: #a9aebd; stroke-width: 3; stroke-linecap: round; }
  .comp-svg .terminal-hit { fill: rgba(109,91,208,0.15); stroke: var(--accent); stroke-width: 2; cursor: crosshair; }
  .comp-svg .terminal-hit:hover { fill: rgba(109,91,208,0.35); }
  .comp-svg .terminal-hit.connected { fill: var(--ok); stroke: #1f7a4c; }
  .comp-svg .terminal-text { font-size: 6px; fill: var(--muted); text-anchor: middle; }
  .rotate-btn {
    position: absolute; top: -8px; right: -8px; width: 20px; height: 20px; border-radius: 50%;
    border: 1px solid var(--accent-dark); background: #fff; color: var(--accent);
    font-size: 0.75rem; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0; z-index: 4;
  }
  .rotate-btn:hover { background: var(--accent); color: #fff; }

  .comp-svg .btn-corner-leg { stroke: #9aa0ab; stroke-width: 2; stroke-linecap: round; }
  .comp-svg .btn-housing { fill: #45484f; stroke: #24262b; stroke-width: 1.5; }
  .comp-svg .btn-housing-top { fill: rgba(255,255,255,0.14); pointer-events: none; }
  .comp-svg .btn-cap { fill: url(#btnCapGrad); stroke: #14591f; stroke-width: 1.5; cursor: pointer; transition: transform 0.08s; transform-box: fill-box; transform-origin: center; }
  .comp-svg .btn-cap.pressed { fill: url(#btnCapGradPressed); transform: scale(0.88); }
  .comp-svg .btn-cap-shine { fill: rgba(255,255,255,0.4); pointer-events: none; }

  .comp-svg .buzzer-rim { fill: #d5d9e1; stroke: #7d8290; stroke-width: 1; }
  .comp-svg .buzzer-body { fill: url(#buzzerGrad); stroke: #050505; stroke-width: 1.5; transition: filter 0.1s; }
  .comp-svg .buzzer-body.buzzing { filter: drop-shadow(0 0 6px rgba(255,205,60,0.95)); }
  .comp-svg .buzzer-hole { fill: rgba(0,0,0,0.55); }
  .comp-svg .buzzer-plus { font-size: 9px; fill: rgba(255,255,255,0.55); text-anchor: middle; pointer-events: none; }

  /* code editor */
  #codeEditor {
    flex: 1; width: 100%; resize: none;
    font-family: "Consolas", "SFMono-Regular", Menlo, monospace;
    font-size: 0.85rem; line-height: 1.5; padding: 10px; border-radius: 8px;
    border: 1px solid var(--border); background: #fbfbff; color: var(--text);
  }
  .hint { font-size: 0.7rem; color: var(--muted); margin: 6px 0 0; }

  /* toolbar */
  .toolbar {
    max-width: 1300px; margin: 12px auto 0; padding: 10px 14px;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .toolbar button {
    padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel); font-size: 0.9rem; cursor: pointer;
  }
  .toolbar button:hover { background: #f1f0ff; }
  #runBtn { background: var(--accent); color: #fff; border-color: var(--accent-dark); }
  #runBtn:hover { background: var(--accent-dark); }
  #runBtn:disabled, .toolbar button:disabled { opacity: 0.5; cursor: not-allowed; }
  #gradeBtn { border-color: var(--ok); color: #17583a; font-weight: 600; }
  #gradeBtn:hover { background: #eafbf1; }
  #statusLabel {
    margin-left: auto; font-size: 0.85rem; font-weight: 600; color: var(--muted);
    padding: 6px 10px; border-radius: 6px; background: #eef0fa;
  }
  #statusLabel.running { color: #fff; background: var(--ok); }
  #statusLabel.error { color: #fff; background: var(--danger); }

  .nickname-row { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--muted); }
  .nickname-row input { padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); width: 140px; font-size: 0.8rem; }

  #shareBanner { max-width: 1300px; margin: 0 auto 10px; padding: 0 14px; }
  #shareBanner .inner {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    background: #eafbf1; border: 1px solid var(--ok); color: #17583a;
    padding: 10px 14px; border-radius: 8px; font-size: 0.85rem;
  }
  #shareBanner input { flex: 1; min-width: 200px; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); font-size: 0.8rem; }
  #shareBanner button { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--ok); background: #fff; cursor: pointer; font-size: 0.8rem; }
  #shareBanner.hidden { display: none; }

  /* console */
  .console-panel { max-width: 1300px; margin: 0 auto 20px; padding: 0 14px; }
  .console-panel h2 { font-size: 0.85rem; color: var(--muted); margin: 4px 0 6px; }
  #consoleOutput {
    background: var(--console-bg); color: var(--console-text);
    font-family: "Consolas", monospace; font-size: 0.82rem;
    border-radius: 10px; padding: 10px 12px; height: 130px; overflow-y: auto; line-height: 1.5;
  }
  #consoleOutput .err { color: #ff8b8b; }
  #consoleOutput .ok { color: #7dffb0; }

  /* wires */
  .wire-perm { fill: none; stroke: #2fa66a; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .wire-drag { fill: none; stroke: #6d5bd0; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 5,4; }

  /* modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(20, 20, 30, 0.55); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal-overlay.hidden { display: none; }
  .modal-box { background: #fff; border-radius: 12px; padding: 26px 30px; max-width: 380px; text-align: center; }
  .modal-box p { color: var(--muted); line-height: 1.6; white-space: pre-line; }
  .modal-box button { margin-top: 14px; padding: 9px 18px; border-radius: 8px; border: none; background: var(--accent); color: #fff; cursor: pointer; font-size: 0.9rem; }
</style>
</head>
<body>

<header class="app-header">
  <h1>🫐 피코 시뮬레이터</h1>
  <p>선을 연결하고 Python으로 제어하기</p>
</header>

<div class="stage-tabs" id="stageTabs"></div>

<main class="workspace">
  <section class="panel" id="palettePanel">
    <h2>부품</h2>
    <div class="mission-box">
      <div class="mission-title">🎯 오늘의 미션</div>
      <p class="mission-text" id="missionText"></p>
    </div>
    <div id="paletteComponents"></div>
    <p class="privacy-note">개인정보 보호를 위해 이름·학급·학번을 입력하지 마세요.</p>
    <h2 class="blocks-heading">🧩 코드 블록 (드래그해서 추가)</h2>
    <div class="code-blocks" id="codeBlocks"></div>
  </section>

  <section class="panel">
    <h2>보드 캔버스</h2>
    <div id="boardCanvas">
      <svg id="wireLayer">
        <defs>
          <radialGradient id="ledGradOff" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#e46a6a"/>
            <stop offset="100%" stop-color="#8a2222"/>
          </radialGradient>
          <radialGradient id="ledGradOn" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#fff3b0"/>
            <stop offset="55%" stop-color="#ff5a3c"/>
            <stop offset="100%" stop-color="#c21818"/>
          </radialGradient>
          <radialGradient id="btnCapGrad" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#8fef9c"/>
            <stop offset="100%" stop-color="#1f8a3d"/>
          </radialGradient>
          <radialGradient id="btnCapGradPressed" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#5cb86e"/>
            <stop offset="100%" stop-color="#145a20"/>
          </radialGradient>
          <radialGradient id="buzzerGrad" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#5a5d68"/>
            <stop offset="100%" stop-color="#16171b"/>
          </radialGradient>
        </defs>
      </svg>
      <div class="pico-board-wrap" id="picoBoardWrap">
        <div class="pico-pins-col left" id="pinColLeft"></div>
        <div class="pico-board" id="picoBoard">
          <div class="pico-hole tl"></div>
          <div class="pico-hole tr"></div>
          <div class="pico-hole bl"></div>
          <div class="pico-hole br"></div>
          <div class="pico-title">Raspberry Pi Pico WH</div>
          <div class="pico-usb"></div>
          <div class="pico-row">
            <div class="pico-boot" title="BOOTSEL"></div>
            <div class="pico-debug">
              <div class="pico-debug-pins"><span></span><span></span><span></span></div>
              <div class="pico-debug-label">DEBUG</div>
            </div>
          </div>
          <div class="pico-chip">
            <svg class="pico-chip-logo" viewBox="0 0 24 24"><circle cx="8" cy="8" r="5" fill="#c62828"/><circle cx="16" cy="8" r="5" fill="#c62828"/><circle cx="12" cy="16" r="5" fill="#c62828"/></svg>
          </div>
          <div class="pico-wifi"></div>
          <div class="pico-wifi-label">Wi‑Fi 모듈</div>
        </div>
        <div class="pico-pins-col right" id="pinColRight"></div>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2>코드 에디터</h2>
    <textarea id="codeEditor" spellcheck="false"></textarea>
    <p class="hint" id="hintText"></p>
  </section>
</main>

<div class="toolbar">
  <button id="runBtn">▶ 실행</button>
  <button id="stopBtn">■ 정지</button>
  <button id="resetBtn">↺ 초기화</button>
  <button id="gradeBtn">📝 채점</button>
  <button id="saveBtn">💾 저장</button>
  <div class="nickname-row">
    <label for="nicknameInput">별칭(선택)</label>
    <input id="nicknameInput" type="text" maxlength="12" placeholder="실명 대신 별명">
  </div>
  <span id="statusLabel">상태: 대기중</span>
</div>

<div id="shareBanner" class="hidden">
  <div class="inner">
    <span id="shareWorkName"></span>
    <input id="shareLinkInput" type="text" readonly>
    <button id="copyShareBtn">링크 복사</button>
  </div>
</div>

<div class="console-panel">
  <h2>콘솔</h2>
  <div id="consoleOutput"></div>
</div>

<div id="notFoundModal" class="modal-overlay hidden">
  <div class="modal-box">
    <p>저장된 작품을 찾을 수 없습니다.</p>
    <button id="restartBtn">새로 시작</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ================= stage configuration =================
  var COMPONENT_LABEL = { led: "LED", button: "버튼", buzzer: "부저" };
  var COMPONENT_PIN = { led: 15, button: 14, buzzer: 16 };

  var STAGES = [
    {
      id: 1,
      title: "1단계: LED 깜빡이기",
      mission: "LED의 신호선을 <b>GP15</b>에, GND선을 <b>GND</b>에 연결하세요.<br>그리고 LED가 1초 간격으로 깜빡이도록 코드를 완성한 뒤 <b>[▶ 실행]</b>을 눌러보세요!",
      components: ["led"],
      requiredWiring: [
        { type: "led", terminal: "signal", pin: "GP15" },
        { type: "led", terminal: "gnd", pin: "GND" }
      ],
      requireSleep: true,
      hintText: "지원 명령: import machine · import time · Pin(15, Pin.OUT) · led.toggle() · sleep(초) · while True · #설명(주석)",
      defaultCode: [
        "# 🧩 1단계: LED를 켜고 끄는 코드를 만들어보세요.",
        "# 왼쪽의 코드 블록을 드래그하거나, 직접 타이핑해도 돼요.",
        "#",
        "# 순서: 1) import 불러오기  2) Pin 선언  3) while True:  4) 켜고 끄기 + 대기",
        "#",

  // ================= board pins =================
  function buildPinColumn(container, labels) {
    labels.forEach(function (label) {
      var wrap = document.createElement("div");
      wrap.className = "pin-wrap";
      var lab = document.createElement("div");
      lab.className = "pin-label";
      lab.textContent = label;
      var dot = document.createElement("div");
      dot.className = "pin";
      dot.dataset.pin = label;
      wrap.appendChild(lab);
      wrap.appendChild(dot);
      container.appendChild(wrap);
      if (!pinEls[label]) pinEls[label] = [];
      pinEls[label].push(dot);
    });
  }
  function buildBoard() {
    pinColLeft.innerHTML = "";
    pinColRight.innerHTML = "";
    pinEls = {};
    buildPinColumn(pinColLeft, LEFT_PINS);
    buildPinColumn(pinColRight, RIGHT_PINS);

  function clearWires() {
    Array.from(wireLayer.querySelectorAll("path")).forEach(function (p) { p.remove(); }); // keep <defs>, only drop wire paths

  function resetBoardPosition() {
    picoBoardWrap.style.left = "";

  function startBoardMove(e, usePointer) {
    e.preventDefault();
    var canvasRect = boardCanvas.getBoundingClientRect();
    var wrapRect = picoBoardWrap.getBoundingClientRect();
    var startLeft = wrapRect.left - canvasRect.left;
    var startTop = wrapRect.top - canvasRect.top;
    // switch from the centered left:50%/transform default to plain absolute px so dragging is simple math
    picoBoardWrap.style.transform = "none";
    picoBoardWrap.style.left = startLeft + "px";
    picoBoardWrap.style.top = startTop + "px";

    var startX = e.clientX, startY = e.clientY;
    var moveEvt = usePointer ? "pointermove" : "mousemove";
    var upEvt = usePointer ? "pointerup" : "mouseup";
    function onMove(ev) {
      var rect = boardCanvas.getBoundingClientRect();
      var newLeft = Math.max(0, Math.min(startLeft + (ev.clientX - startX), rect.width - wrapRect.width));
      var newTop = Math.max(0, Math.min(startTop + (ev.clientY - startY), rect.height - wrapRect.height));
      picoBoardWrap.style.left = newLeft + "px";
      picoBoardWrap.style.top = newTop + "px";
      redrawWires();
    }
    function onUp() {
      document.removeEventListener(moveEvt, onMove);
      document.removeEventListener(upEvt, onUp);
    }
    document.addEventListener(moveEvt, onMove);
    document.addEventListener(upEvt, onUp);
  }

  function terminalPair(svg, sigXY, gndXY, labelY) {

    var gndDot = svgEl("circle", { "class": "terminal-hit", "data-terminal": "gnd", cx: gndXY[0], cy: gndXY[1], r: 7 });
    svg.appendChild(sigDot);

    var sigText = svgEl("text", { "class": "terminal-text", x: sigXY[0], y: labelY });
    sigText.textContent = "신호";
    var gndText = svgEl("text", { "class": "terminal-text", x: gndXY[0], y: labelY });
    gndText.textContent = "GND";
    svg.appendChild(sigText);
    svg.appendChild(gndText);
    return { sigDot: sigDot, gndDot: gndDot };
  }

    svg.appendChild(svgEl("path", { "class": "led-dome", d: "M8,38 L8,20 A20,20 0 0 1 48,20 L48,38 Z" }));

  // ================= wiring geometry =================
  function elCenter(el) {
    var r = el.getBoundingClientRect();
    var cRect = boardCanvas.getBoundingClientRect();
    return { x: r.left + r.width / 2 - cRect.left, y: r.top + r.height / 2 - cRect.top };
  }
  function elbowPath(x1, y1, x2, y2) {
    var midY = y1 + (y2 - y1) * 0.6;
    return "M" + x1 + "," + y1 + " L" + x1 + "," + midY + " L" + x2 + "," + midY + " L" + x2 + "," + y2;
  }
  function redrawWires() {
    Object.keys(placed).forEach(function (type) {
      var comp = placed[type];
      if (!comp) return;
      ["signal", "gnd"].forEach(function (term) {
        var w = comp.wires[term];
        if (!w) return;
        var start = elCenter(w.termEl);
        var end = elCenter(w.pinEl);
        w.path.setAttribute("d", elbowPath(start.x, start.y, end.x, end.y));
      });
    });
  }
  function isPinWired(pinNumber) {
    var expected = "GP" + pinNumber;
    return Object.keys(placed).some(function (type) {
      var comp = placed[type];
      if (!comp || !comp.wires.signal || !comp.wires.gnd) return false;
      return comp.wires.signal.pinEl.dataset.pin === expected && comp.wires.gnd.pinEl.dataset.pin === "GND";
    });
  }
  function expectedPinFor(componentType, terminalType) {
    var entry = currentStage.requiredWiring.filter(function (r) { return r.type === componentType && r.terminal === terminalType; })[0];
    return entry ? entry.pin : null;
  }

  // ================= component placement =================
  function placeComponent(type, x, y) {
    if (placed[type]) return;
    var built = type === "led" ? buildLedSvg() : type === "button" ? buildButtonSvg() : buildBuzzerSvg();

    var el = document.createElement("div");
    el.className = "component " + type + "-component";
    el.style.left = x + "px";
    el.style.top = y + "px";
    el.appendChild(built.svg);
    boardCanvas.appendChild(el);

    placed[type] = { el: el, svg: built.svg, wires: { signal: null, gnd: null }, rotation: 0 };

    bindDragStart(built.sigDot, function (e, usePointer) { startWireDrag(e, built.sigDot, "signal", type, usePointer); });
    bindDragStart(built.gndDot, function (e, usePointer) { startWireDrag(e, built.gndDot, "gnd", type, usePointer); });

    // every component can be repositioned and rotated in place, same as the LED
    bindDragStart(built.svg, function (e, usePointer) { startComponentMove(e, type, usePointer); });
    var rotateBtn = document.createElement("button");
    rotateBtn.type = "button";
    rotateBtn.className = "rotate-btn";
    rotateBtn.textContent = "↻";
    rotateBtn.title = "방향 회전";
    el.appendChild(rotateBtn);
    rotateBtn.addEventListener("click", function () {
      placed[type].rotation = (placed[type].rotation + 90) % 360;
      built.svg.style.transform = "rotate(" + placed[type].rotation + "deg)";
      redrawWires();
    });

    if (type === "button") {
      // stopPropagation so pressing the cap doesn't also start dragging the whole button
      bindDragStart(built.cap, function (e) { e.preventDefault(); e.stopPropagation(); setButtonPressed(true, built.cap); });
      document.addEventListener("pointerup", function () { setButtonPressed(false, built.cap); });
      document.addEventListener("mouseup", function () { if (!pointerCapable) setButtonPressed(false, built.cap); });
    }

    log(COMPONENT_LABEL[type] + "를 캔버스에 배치했어요.");
  }

  function setButtonPressed(pressed, capEl) {
    buttonPressed = pressed;
    capEl.classList.toggle("pressed", pressed);
  }

  function startComponentMove(e, type, usePointer) {
    e.preventDefault();
    var comp = placed[type];
    var startX = e.clientX, startY = e.clientY;
    var origLeft = parseFloat(comp.el.style.left) || 0;
    var origTop = parseFloat(comp.el.style.top) || 0;
    var moveEvt = usePointer ? "pointermove" : "mousemove";
    var upEvt = usePointer ? "pointerup" : "mouseup";
    function onMove(ev) {
      var rect = boardCanvas.getBoundingClientRect();
      var newLeft = Math.max(0, Math.min(origLeft + (ev.clientX - startX), rect.width - 56));
      var newTop = Math.max(0, Math.min(origTop + (ev.clientY - startY), rect.height - 86));
      comp.el.style.left = newLeft + "px";
      comp.el.style.top = newTop + "px";
      redrawWires();
    }
    function onUp() {
      document.removeEventListener(moveEvt, onMove);
      document.removeEventListener(upEvt, onUp);
    }
    document.addEventListener(moveEvt, onMove);
    document.addEventListener(upEvt, onUp);
  }

  function removeAllComponents() {
    Object.keys(placed).forEach(function (type) { if (placed[type]) placed[type].el.remove(); });
    placed = {};
  }

  function updateLedVisual(on) {
    var comp = placed.led;
    if (!comp) return;
    comp.el.classList.toggle("on", on);

  // ================= buzzer audio =================
  var audioCtx = null, buzzOsc = null, buzzGain = null;
  function ensureAudio() {
    if (audioCtx) return;
    try {

      buzzGain = audioCtx.createGain();

      buzzOsc.type = "square";
      buzzOsc.frequency.value = 880;
      buzzOsc.connect(buzzGain);

    if (comp) comp.svg.querySelector(".buzzer-body").classList.toggle("buzzing", on);

  function stopAudio() {

  // ================= palette drag-to-place =================
  function renderPalette() {
    paletteComponentsEl.innerHTML = "";
    currentStage.components.forEach(function (type) {
      var item = document.createElement("div");
      item.className = "palette-item";
      item.appendChild(buildPaletteIcon(type));
      var span = document.createElement("span");
      span.textContent = COMPONENT_LABEL[type];

    });

  function startPlaceDrag(e, item, type, usePointer) {
    if (placed[type]) { log(COMPONENT_LABEL[type] + "는 1개만 배치할 수 있어요.", "err"); return; }
    e.preventDefault();
    var ghost = item.cloneNode(true);
    ghost.style.position = "fixed";
    ghost.style.pointerEvents = "none";
    ghost.style.opacity = "0.8";
    ghost.style.zIndex = "100";
    ghost.style.width = item.offsetWidth + "px";
    document.body.appendChild(ghost);
    moveGhost(e.clientX, e.clientY);

    var moveEvt = usePointer ? "pointermove" : "mousemove";
    var upEvt = usePointer ? "pointerup" : "mouseup";

    function moveGhost(cx, cy) {
      ghost.style.left = (cx - ghost.offsetWidth / 2) + "px";
      ghost.style.top = (cy - ghost.offsetHeight / 2) + "px";
    }
    function onMove(ev) { moveGhost(ev.clientX, ev.clientY); }
    function onUp(ev) {
      document.removeEventListener(moveEvt, onMove);
      document.removeEventListener(upEvt, onUp);
      ghost.remove();
      var rect = boardCanvas.getBoundingClientRect();
      if (ev.clientX >= rect.left && ev.clientX <= rect.right && ev.clientY >= rect.top && ev.clientY <= rect.bottom) {
        var x = Math.max(4, Math.min(ev.clientX - rect.left - 18, rect.width - 60));
        var y = Math.max(4, Math.min(ev.clientY - rect.top - 18, rect.height - 80));
        placeComponent(type, x, y);
      }
    }
    document.addEventListener(moveEvt, onMove);
    document.addEventListener(upEvt, onUp);
  }

  // ================= code blocks (drag or type) =================
  function buildCodeBlocks() {
    codeBlocksContainer.innerHTML = "";
    currentStage.codeBlocks.forEach(function (blk) {
      var el = document.createElement("div");
      el.className = "code-block";
      el.textContent = blk.label;
      el.title = blk.code;
      codeBlocksContainer.appendChild(el);
      bindDragStart(el, function (e, usePointer) { startBlockDrag(e, el, blk, usePointer); });
    });
  }
  // Inserts the block as a new line right after the line the caret is currently on
  // (falls back to the end of the code if the editor hasn't been focused yet).
  function insertSnippet(codeText) {
    var current = codeEditor.value;
    var pos = lastCursorPos != null ? Math.max(0, Math.min(lastCursorPos, current.length)) : current.length;
    var lineEnd = current.indexOf("\n", pos);
    if (lineEnd === -1) lineEnd = current.length;
    var before = current.slice(0, lineEnd);
    var after = current.slice(lineEnd);
    var insertion = "\n" + codeText;
    codeEditor.value = before + insertion + after;
    var newPos = before.length + insertion.length;
    codeEditor.focus();
    codeEditor.setSelectionRange(newPos, newPos);
    lastCursorPos = newPos;
    codeEditor.scrollTop = codeEditor.scrollHeight;
  }
  function startBlockDrag(e, el, blk, usePointer) {
    e.preventDefault();
    var ghost = el.cloneNode(true);
    ghost.style.position = "fixed";
    ghost.style.pointerEvents = "none";
    ghost.style.opacity = "0.85";
    ghost.style.zIndex = "100";
    ghost.style.width = el.offsetWidth + "px";
    document.body.appendChild(ghost);
    moveGhost(e.clientX, e.clientY);

    var moveEvt = usePointer ? "pointermove" : "mousemove";
    var upEvt = usePointer ? "pointerup" : "mouseup";

    function moveGhost(cx, cy) {
      ghost.style.left = (cx - ghost.offsetWidth / 2) + "px";
      ghost.style.top = (cy - ghost.offsetHeight / 2) + "px";
    }
    function overEditor(cx, cy) {
      var r = codeEditor.getBoundingClientRect();
      return cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom;
    }
    function onMove(ev) {
      moveGhost(ev.clientX, ev.clientY);
      codeEditor.classList.toggle("drop-hover", overEditor(ev.clientX, ev.clientY));
    }
    function onUp(ev) {
      document.removeEventListener(moveEvt, onMove);
      document.removeEventListener(upEvt, onUp);
      ghost.remove();
      codeEditor.classList.remove("drop-hover");
      if (overEditor(ev.clientX, ev.clientY)) {
        insertSnippet(blk.code);
        log("코드 블록을 추가했어요: " + blk.label, "ok");
      }
    }
    document.addEventListener(moveEvt, onMove);
    document.addEventListener(upEvt, onUp);
  }

  // ================= wire dragging =================
  function startWireDrag(e, fromEl, terminalType, componentType, usePointer) {
    e.preventDefault();
    e.stopPropagation();
    var start = elCenter(fromEl);
    var line = svgEl("path", { "class": "wire-drag", d: elbowPath(start.x, start.y, start.x, start.y) });
    wireLayer.appendChild(line);

    dragWire = { fromEl: fromEl, terminalType: terminalType, componentType: componentType, line: line, start: start };

    var moveEvt = usePointer ? "pointermove" : "mousemove";
    var upEvt = usePointer ? "pointerup" : "mouseup";

    function onMove(ev) {
      var cRect = boardCanvas.getBoundingClientRect();
      var x2 = ev.clientX - cRect.left, y2 = ev.clientY - cRect.top;
      line.setAttribute("d", elbowPath(start.x, start.y, x2, y2));
    }
    function onUp(ev) {
      document.removeEventListener(moveEvt, onMove);
      document.removeEventListener(upEvt, onUp);
      var target = document.elementFromPoint(ev.clientX, ev.clientY);
      if (target && target.classList.contains("pin")) {
        handleWireDrop(target);
      } else {
        cancelDrag();
      }
    }
    document.addEventListener(moveEvt, onMove);
    document.addEventListener(upEvt, onUp);

    function cancelDrag() {
      if (dragWire && dragWire.line) dragWire.line.remove();
      dragWire = null;
    }
    dragWire._cancel = cancelDrag;
  }

  function handleWireDrop(pinDot) {
    if (!dragWire) return;
    var pinLabel = pinDot.dataset.pin;
    var terminalType = dragWire.terminalType;
    var componentType = dragWire.componentType;
    var expected = expectedPinFor(componentType, terminalType);
    var valid = expected !== null && pinLabel === expected;

    dragWire.line.remove();

    if (!valid) {
      log("잘못된 연결이에요: " + COMPONENT_LABEL[componentType] + " " + (terminalType === "signal" ? "신호선" : "GND선") + " → " + pinLabel, "err");
      log("💡 " + (terminalType === "signal" ? (COMPONENT_LABEL[componentType] + "의 신호선은 " + expected + " 핀에 연결해야 해요.") : "GND선은 GND라고 적힌 핀에 연결해야 해요."));
      pinDot.classList.add("reject");
      setTimeout(function () { pinDot.classList.remove("reject"); }, 400);
      dragWire = null;
      return;
    }

    var start = dragWire.start;
    var end = elCenter(pinDot);
    var perm = svgEl("path", { "class": "wire-perm", d: elbowPath(start.x, start.y, end.x, end.y) });
    wireLayer.appendChild(perm);

    dragWire.fromEl.classList.add("connected");
    pinDot.classList.add("connected");
    placed[componentType].wires[terminalType] = { termEl: dragWire.fromEl, pinEl: pinDot, path: perm };

    log(COMPONENT_LABEL[componentType] + " " + (terminalType === "signal" ? "신호선" : "GND선") + "이 " + pinLabel + "에 연결되었어요.", "ok");
    dragWire = null;
  }

  function connectByLabel(componentType, terminalType, pinLabel) {
    var comp = placed[componentType];
    if (!comp) return;
    var termEl = comp.svg.querySelector('.terminal-hit[data-terminal="' + terminalType + '"]');
    var pinEl = pinEls[pinLabel] && pinEls[pinLabel][0];
    if (!termEl || !pinEl) return;
    var start = elCenter(termEl);
    var end = elCenter(pinEl);
    var perm = svgEl("path", { "class": "wire-perm", d: elbowPath(start.x, start.y, end.x, end.y) });
    wireLayer.appendChild(perm);
    termEl.classList.add("connected");
    pinEl.classList.add("connected");
    comp.wires[terminalType] = { termEl: termEl, pinEl: pinEl, path: perm };
  }

  // ================= code parsing helpers =================
  function checkBrackets(code) {
    var pairs = { "(": ")", "[": "]", "{": "}" };
    var closers = { ")": "(", "]": "[", "}": "{" };
    var stack = [];
    var lines = code.split("\n");
    for (var i = 0; i < lines.length; i++) {
      var line = stripComment(lines[i]);
      for (var j = 0; j < line.length; j++) {
        var ch = line[j];
        if (pairs[ch]) stack.push({ ch: ch, line: i + 1 });
        else if (closers[ch]) {
          if (stack.length === 0 || stack[stack.length - 1].ch !== closers[ch]) {
            return { ok: false, line: i + 1, message: (i + 1) + "번째 줄에서 괄호가 맞지 않아요.", hint: "여는 괄호 '('와 닫는 괄호 ')'의 짝이 맞는지 확인해보세요." };
          }
          stack.pop();
        }
      }
    }
    if (stack.length > 0) {
      return { ok: false, line: stack[stack.length - 1].line, message: stack[stack.length - 1].line + "번째 줄에서 괄호가 닫히지 않았어요.", hint: "여는 괄호 '('를 쓴 곳에는 반드시 닫는 괄호 ')'가 있어야 해요." };
    }
    return { ok: true };
  }
  function getIndent(line) {
    var m = line.match(/^[ \t]*/);
    return m ? m[0].length : 0;
  }
  function stripComment(line) {
    var hashIdx = line.indexOf("#");
    return hashIdx !== -1 ? line.slice(0, hashIdx) : line;
  }

  // ================= generalized code parsing =================
  // Recognizes: X = Pin(N, Pin.OUT) / X = Pin(N, Pin.IN, Pin.PULL_UP), while True:,
  // if X.value() == 0/1: / else:, X.on()/X.off()/X.toggle(), sleep(n), # comments.
  function parseStatements(lines, startIdx, parentIndent, declarations) {
    var statements = [];
    var i = startIdx;
    while (i < lines.length) {
      var raw = lines[i];
      if (raw.trim() === "") { i++; continue; }
      var indent = getIndent(raw);
      if (indent <= parentIndent) break;
      var codePart = stripComment(raw).trim();
      if (codePart === "") { i++; continue; }

      var ifMatch = codePart.match(/^if\s+(\w+)\.value\(\)\s*==\s*(0|1)\s*:$/);
      var callMatch = codePart.match(/^(\w+)\.(on|off|toggle)\(\s*\)$/);
      var sleepMatch = codePart.match(/^sleep\(\s*([\d.]+)\s*\)$/);

      if (ifMatch) {
        var condVar = ifMatch[1], expected = parseInt(ifMatch[2], 10);
        var dev = declarations[condVar];
        if (!dev) return { error: { message: (i + 1) + "번째 줄: '" + condVar + "'가 선언되지 않았어요.", hint: "먼저 Pin(...)으로 " + condVar + "를 선언해야 해요.", line: i + 1 } };
        if (dev.mode !== "IN") return { error: { message: (i + 1) + "번째 줄: '" + condVar + "'는 입력(IN) 핀이 아니에요.", hint: condVar + ".value()는 Pin(.., Pin.IN, Pin.PULL_UP)으로 선언한 변수에서만 쓸 수 있어요.", line: i + 1 } };

        var thenResult = parseStatements(lines, i + 1, indent, declarations);
        if (thenResult.error) return thenResult;
        var nextI = thenResult.nextIdx;
        var elseBlock = null;
        if (nextI < lines.length) {
          var peek = lines[nextI];
          if (peek.trim() !== "" && getIndent(peek) === indent && /^else\s*:$/.test(stripComment(peek).trim())) {
            var elseResult = parseStatements(lines, nextI + 1, indent, declarations);
            if (elseResult.error) return elseResult;
            elseBlock = elseResult.statements;
            nextI = elseResult.nextIdx;
          }
        }
        statements.push({ type: "if", cond: { varName: condVar, expected: expected }, thenBlock: thenResult.statements, elseBlock: elseBlock });
        i = nextI;
        continue;
      }

      if (/^else\s*:$/.test(codePart)) {
        return { error: { message: (i + 1) + "번째 줄: 짝이 맞는 if가 없는 else예요.", hint: "else: 바로 위 같은 들여쓰기에 if ...: 블록이 있어야 해요.", line: i + 1 } };
      }

      if (callMatch) {
        var cVar = callMatch[1], cMethod = callMatch[2];
        var cdev = declarations[cVar];
        if (!cdev) return { error: { message: (i + 1) + "번째 줄: '" + cVar + "'가 선언되지 않았어요.", hint: "먼저 Pin(...)으로 " + cVar + "를 선언해야 해요.", line: i + 1 } };
        if (cdev.mode !== "OUT") return { error: { message: (i + 1) + "번째 줄: '" + cVar + "'는 출력(OUT) 핀이 아니라서 켜고 끌 수 없어요.", hint: cVar + ".on()/off()/toggle()은 Pin(.., Pin.OUT)으로 선언한 변수에서만 쓸 수 있어요.", line: i + 1 } };
        statements.push({ type: "call", varName: cVar, method: cMethod, pin: cdev.pin });
        i++;
        continue;
      }

      if (sleepMatch) {
        statements.push({ type: "sleep", seconds: Math.max(parseFloat(sleepMatch[1]), 0.05) });
        i++;
        continue;
      }

      return { error: { message: (i + 1) + "번째 줄을 이해할 수 없어요: \"" + codePart + "\"", hint: "이 시뮬레이터는 정해진 명령만 이해할 수 있어요. 왼쪽 코드 블록을 활용해보세요.", line: i + 1 } };
    }
    return { statements: statements, nextIdx: i };
  }

  function containsSleep(statements) {
    return statements.some(function (s) {
      if (s.type === "sleep") return true;
      if (s.type === "if") return containsSleep(s.thenBlock) || (s.elseBlock && containsSleep(s.elseBlock));
      return false;
    });
  }

  function parseCode(code, stage) {
    if (!code || !code.trim()) {
      return { ok: false, message: "먼저 코드를 작성해 주세요.", hint: "왼쪽의 코드 블록을 코드 에디터로 드래그하거나, 직접 코드를 입력해보세요." };
    }
    var bracketCheck = checkBrackets(code);
    if (!bracketCheck.ok) {
      return { ok: false, message: bracketCheck.message, hint: bracketCheck.hint };
    }

    var lines = code.split("\n");

    if (!lines.some(function (l) { return /^\s*import\s+machine\s*$/.test(stripComment(l)); })) {
      return { ok: false, message: "import machine이 필요해요.", hint: "왼쪽의 'machine 불러오기' 코드 블록을 코드 에디터로 드래그해보세요." };
    }
    if (!lines.some(function (l) { return /^\s*import\s+time\s*$/.test(stripComment(l)); })) {
      return { ok: false, message: "import time이 필요해요.", hint: "왼쪽의 'time 불러오기' 코드 블록을 코드 에디터로 드래그해보세요." };
    }

    var declarations = {};
    var outRegex = /^\s*(\w+)\s*=\s*Pin\(\s*(\d+)\s*,\s*Pin\.OUT\s*\)\s*$/;
    var inRegex = /^\s*(\w+)\s*=\s*Pin\(\s*(\d+)\s*,\s*Pin\.IN\s*,\s*Pin\.PULL_UP\s*\)\s*$/;
    for (var i = 0; i < lines.length; i++) {
      var lc = stripComment(lines[i]);
      var om = lc.match(outRegex);
      if (om) { declarations[om[1]] = { pin: parseInt(om[2], 10), mode: "OUT" }; continue; }
      var imm = lc.match(inRegex);
      if (imm) { declarations[imm[1]] = { pin: parseInt(imm[2], 10), mode: "IN" }; }
    }
    if (Object.keys(declarations).length === 0) {
      return { ok: false, message: "Pin(...) 선언을 찾을 수 없어요.", hint: "왼쪽의 'Pin 선언' 코드 블록을 코드 에디터로 드래그해보세요." };
    }

    var whileIdx = -1, whileIndent = 0;
    var whileRegex = /^\s*while\s+True\s*:\s*$/;
    for (var w = 0; w < lines.length; w++) {
      if (whileRegex.test(stripComment(lines[w]))) { whileIdx = w; whileIndent = getIndent(lines[w]); break; }
    }
    if (whileIdx === -1) {
      return { ok: false, message: "while True: 반복문이 필요해요.", hint: "왼쪽의 '반복 시작 (while)' 코드 블록을 추가해보세요." };
    }

    var blockResult = parseStatements(lines, whileIdx + 1, whileIndent, declarations);
    if (blockResult.error) {
      return { ok: false, message: blockResult.error.message, hint: blockResult.error.hint };
    }
    if (blockResult.statements.length === 0) {
      return { ok: false, message: "while True: 안에 실행할 코드가 없어요.", hint: "왼쪽의 코드 블록을 while True: 아래로 추가해보세요." };
    }
    if (stage.requireSleep && !containsSleep(blockResult.statements)) {
      return { ok: false, message: "sleep이 없어 실행을 중단했어요.", hint: "while True: 안에 sleep() 블록을 추가해보세요." };
    }

    return { ok: true, declarations: declarations, body: blockResult.statements };
  }

  // ================= execution (generator-based interpreter) =================
  function applyCall(stmt) {
    var pin = stmt.pin;
    var newState = stmt.method === "toggle" ? !pinOutputState[pin] : stmt.method === "on";
    pinOutputState[pin] = newState;
    if (pin === 15) { updateLedVisual(newState); log(newState ? "LED ON" : "LED OFF"); }
    else if (pin === 16) { setBuzzerAudio(newState); log(newState ? "부저 ON 🔊" : "부저 OFF"); }
  }
  function readInputPin(pin) {
    if (pin === 14) return buttonPressed ? 0 : 1; // PULL_UP: pressed=0, released=1
    return 1;
  }
  function evalCond(cond, declarations) {
    var dev = declarations[cond.varName];
    if (!dev) return false;
    return readInputPin(dev.pin) === cond.expected;
  }
  function* runBlock(statements, declarations) {
    for (var i = 0; i < statements.length; i++) {
      var stmt = statements[i];
      if (stmt.type === "call") {
        applyCall(stmt);
      } else if (stmt.type === "sleep") {
        yield stmt.seconds;
      } else if (stmt.type === "if") {
        var branch = evalCond(stmt.cond, declarations) ? stmt.thenBlock : stmt.elseBlock;
        if (branch) yield* runBlock(branch, declarations);
      }
    }
  }
  // Always yields at least once per full pass through the loop body, even if the
  // user's code has no sleep() on the taken branch — keeps a tight polling loop
  // (e.g. button checks) from freezing the tab, at a safe ~20Hz poll rate.
  function* runLoop(whileBody, declarations) {
    while (true) {
      yield* runBlock(whileBody, declarations);
      yield 0.05;
    }
  }

  function runProgram() {
    stopProgram();
    ensureAudio();
    var code = codeEditor.value;
    var result = parseCode(code, currentStage);

    if (!result.ok) {
      log(result.message, "err");
      if (result.hint) log("💡 " + result.hint);
      setStatus("오류", "error");
      return;
    }

    var missingPin = null;
    Object.keys(result.declarations).forEach(function (v) {
      var d = result.declarations[v];
      if (missingPin === null && !isPinWired(d.pin)) missingPin = d.pin;
    });
    if (missingPin !== null) {
      log("GP" + missingPin + "에 연결된 부품이 없어요.", "err");
      log("💡 보드 캔버스에서 부품의 신호선을 GP" + missingPin + "에, GND선을 GND 핀에 드래그해서 연결해보세요.");
      setStatus("오류", "error");
      return;
    }

    isRunning = true;
    runBtn.disabled = true;
    setStatus("실행 중", "running");
    log("실행을 시작합니다.", "ok");

    var gen = runLoop(result.body, result.declarations);
    function step() {
      if (!isRunning) return;
      var r = gen.next();
      if (r.done) return;
      execTimer = setTimeout(step, r.value * 1000);
    }
    step();
  }

  function stopProgram() {
    if (execTimer) { clearTimeout(execTimer); execTimer = null; }
    if (isRunning) { log("실행을 정지했어요."); }
    isRunning = false;
    runBtn.disabled = false;
    updateLedVisual(false);
    setBuzzerAudio(false);
    if (statusLabel.textContent !== "상태: 오류") setStatus("정지됨");
  }

  // ================= grading =================
  function gradeStage1(code) {
    var checks = [];
    checks.push({ label: "import machine를 불러왔어요", pass: /^\s*import\s+machine\s*(#.*)?$/m.test(code), hint: "왼쪽의 'machine 불러오기' 코드 블록을 드래그해보세요." });
    checks.push({ label: "import time를 불러왔어요", pass: /^\s*import\s+time\s*(#.*)?$/m.test(code), hint: "왼쪽의 'time 불러오기' 코드 블록을 드래그해보세요." });
    var pinMatch = code.match(/(\w+)\s*=\s*Pin\(\s*15\s*,\s*Pin\.OUT\s*\)/);
    checks.push({ label: "Pin(15, Pin.OUT)로 LED 핀을 선언했어요", pass: !!pinMatch, hint: "왼쪽의 'Pin 선언' 코드 블록을 드래그해보세요." });
    checks.push({ label: "while True: 반복문을 사용했어요", pass: /while\s+True\s*:/.test(code), hint: "왼쪽의 '반복 시작 (while)' 코드 블록을 추가해보세요." });
    var varName = pinMatch ? pinMatch[1] : "led";
    checks.push({ label: varName + ".toggle()로 LED를 켜고 껐어요", pass: new RegExp(escapeRe(varName) + "\\.toggle\\(\\s*\\)").test(code), hint: "'불 켜고 끄기' 블록을 while True: 안에 추가해보세요." });
    checks.push({ label: "sleep()으로 점멸 간격을 넣었어요", pass: /sleep\(\s*[\d.]+\s*\)/.test(code), hint: "'1초 대기' 같은 sleep() 블록을 추가해보세요." });
    checks.push({ label: "LED 신호선을 GP15에, GND선을 GND에 연결했어요", pass: isPinWired(15), hint: "보드 캔버스에서 LED의 신호선을 GP15에, GND선을 GND 핀에 드래그해서 연결해보세요." });
    return checks;
  }

  function gradeStage2(code) {
    var checks = [];
    checks.push({ label: "import machine를 불러왔어요", pass: /^\s*import\s+machine\s*(#.*)?$/m.test(code), hint: "왼쪽의 'machine 불러오기' 코드 블록을 드래그해보세요." });
    checks.push({ label: "import time를 불러왔어요", pass: /^\s*import\s+time\s*(#.*)?$/m.test(code), hint: "왼쪽의 'time 불러오기' 코드 블록을 드래그해보세요." });
    var ledMatch = code.match(/(\w+)\s*=\s*Pin\(\s*15\s*,\s*Pin\.OUT\s*\)/);
    checks.push({ label: "LED Pin(15, Pin.OUT)을 선언했어요", pass: !!ledMatch, hint: "왼쪽의 'LED Pin 선언' 코드 블록을 드래그해보세요." });
    var btnMatch = code.match(/(\w+)\s*=\s*Pin\(\s*14\s*,\s*Pin\.IN\s*,\s*Pin\.PULL_UP\s*\)/);
    checks.push({ label: "버튼 Pin(14, Pin.IN, Pin.PULL_UP)을 선언했어요", pass: !!btnMatch, hint: "왼쪽의 '버튼 Pin 선언' 코드 블록을 드래그해보세요." });
    checks.push({ label: "while True: 반복문을 사용했어요", pass: /while\s+True\s*:/.test(code), hint: "왼쪽의 '반복 시작 (while)' 코드 블록을 추가해보세요." });
    var btnVar = btnMatch ? btnMatch[1] : "button";
    checks.push({ label: "if " + btnVar + ".value() == 0: 으로 버튼을 확인했어요", pass: new RegExp(escapeRe(btnVar) + "\\.value\\(\\)\\s*==\\s*0").test(code), hint: "왼쪽의 '버튼 눌림 확인 (if)' 코드 블록을 추가해보세요." });
    var ledVar = ledMatch ? ledMatch[1] : "led";
    checks.push({ label: ledVar + ".on()으로 LED를 켰어요", pass: new RegExp(escapeRe(ledVar) + "\\.on\\(\\s*\\)").test(code), hint: "'LED 켜기' 블록을 if: 안에 추가해보세요." });
    checks.push({ label: ledVar + ".off()으로 LED를 껐어요", pass: new RegExp(escapeRe(ledVar) + "\\.off\\(\\s*\\)").test(code), hint: "'LED 끄기' 블록을 else: 안에 추가해보세요." });
    checks.push({ label: "LED를 GP15/GND에 연결했어요", pass: isPinWired(15), hint: "보드 캔버스에서 LED의 신호선을 GP15에, GND선을 GND 핀에 연결해보세요." });
    checks.push({ label: "버튼을 GP14/GND에 연결했어요", pass: isPinWired(14), hint: "보드 캔버스에서 버튼의 신호선을 GP14에, GND선을 GND 핀에 연결해보세요." });
    return checks;
  }

  function gradeStage3(code) {
    var checks = [];
    checks.push({ label: "import machine를 불러왔어요", pass: /^\s*import\s+machine\s*(#.*)?$/m.test(code), hint: "왼쪽의 'machine 불러오기' 코드 블록을 드래그해보세요." });
    checks.push({ label: "import time를 불러왔어요", pass: /^\s*import\s+time\s*(#.*)?$/m.test(code), hint: "왼쪽의 'time 불러오기' 코드 블록을 드래그해보세요." });
    var bzMatch = code.match(/(\w+)\s*=\s*Pin\(\s*16\s*,\s*Pin\.OUT\s*\)/);
    checks.push({ label: "부저 Pin(16, Pin.OUT)을 선언했어요", pass: !!bzMatch, hint: "왼쪽의 '부저 Pin 선언' 코드 블록을 드래그해보세요." });
    checks.push({ label: "while True: 반복문을 사용했어요", pass: /while\s+True\s*:/.test(code), hint: "왼쪽의 '반복 시작 (while)' 코드 블록을 추가해보세요." });
    var bzVar = bzMatch ? bzMatch[1] : "buzzer";
    checks.push({ label: bzVar + ".on()을 사용했어요", pass: new RegExp(escapeRe(bzVar) + "\\.on\\(\\s*\\)").test(code), hint: "'부저 켜기' 블록을 while True: 안에 추가해보세요." });
    checks.push({ label: bzVar + ".off()을 사용했어요", pass: new RegExp(escapeRe(bzVar) + "\\.off\\(\\s*\\)").test(code), hint: "'부저 끄기' 블록을 while True: 안에 추가해보세요." });
    checks.push({ label: "sleep()으로 리듬 간격을 넣었어요", pass: /sleep\(\s*[\d.]+\s*\)/.test(code), hint: "sleep() 블록을 buzzer.on()/off() 사이에 추가해보세요." });
    checks.push({ label: "부저를 GP16/GND에 연결했어요", pass: isPinWired(16), hint: "보드 캔버스에서 부저의 신호선을 GP16에, GND선을 GND 핀에 연결해보세요." });
    return checks;
  }

  function gradeCode() {
    var code = codeEditor.value;
    var checks = currentStage.buildChecks(code);
    var passCount = checks.filter(function (c) { return c.pass; }).length;
    log("──── 채점 결과 ────");
    checks.forEach(function (c) {
      log((c.pass ? "✅ " : "❌ ") + c.label, c.pass ? "ok" : "err");
      if (!c.pass) log("   💡 " + c.hint);
    });
    var allPass = passCount === checks.length;
    log(passCount + " / " + checks.length + " 항목 통과" + (allPass ? " — 완벽해요! 🎉" : ""), allPass ? "ok" : "");
    setStatus(allPass ? "채점 완료: 통과" : "채점 완료: " + passCount + "/" + checks.length, allPass ? "running" : "error");
  }

  // ================= stage switching / reset =================
  function renderStageTabs() {
    stageTabsEl.innerHTML = "";
    STAGES.forEach(function (stage, idx) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "stage-tab" + (idx === currentStageIndex ? " active" : "");
      btn.textContent = stage.title;
      btn.addEventListener("click", function () { switchStage(idx); });
      stageTabsEl.appendChild(btn);
    });
  }

  function switchStage(index) {
    stopProgram();
    stopAudio();
    currentStageIndex = index;
    currentStage = STAGES[index];

    removeAllComponents();
    clearWires();
    buildBoard();
    resetBoardPosition();
    renderPalette();
    buildCodeBlocks();

    missionTextEl.innerHTML = currentStage.mission;
    hintTextEl.textContent = currentStage.hintText;
    codeEditor.value = currentStage.defaultCode;
    nicknameInput.value = "";
    lastCursorPos = null;
    clearConsole();
    setStatus("대기중");
    shareBanner.classList.add("hidden");
    renderStageTabs();
    history.replaceState(null, "", location.pathname);
  }

  function resetCurrentStage() { switchStage(currentStageIndex); }

  // ================= save / share (Firebase hook, localStorage fallback) =================
  // 실제 배포 시 아래 storage.save/load 내부에 Firebase Firestore 호출을 연결하세요.
  // 지금은 워크숍용으로 localStorage를 임시 백엔드로 사용합니다 (같은 브라우저에서 링크 재현 가능).
  var storage = {
    save: function (data) {
      return new Promise(function (resolve, reject) {
        try {
          var id = generateId();
          localStorage.setItem("picowh_save_" + id, JSON.stringify(data));
          resolve(id);
        } catch (e) { reject(e); }
      });
    },
    load: function (id) {
      return new Promise(function (resolve, reject) {
        try {
          var raw = localStorage.getItem("picowh_save_" + id);
          if (!raw) { reject(new Error("not-found")); return; }
          resolve(JSON.parse(raw));
        } catch (e) { reject(e); }
      });
    }
  };

  function generateId() {
    var chars = "abcdefghijklmnopqrstuvwxyz0123456789";
    var id = "";
    for (var i = 0; i < 6; i++) id += chars[Math.floor(Math.random() * chars.length)];
    return id;
  }

  function saveWork() {
    var componentsData = {};
    currentStage.components.forEach(function (type) {
      var comp = placed[type];
      componentsData[type] = comp ? {
        placed: true,
        wires: {
          signal: comp.wires.signal ? comp.wires.signal.pinEl.dataset.pin : null,
          gnd: comp.wires.gnd ? comp.wires.gnd.pinEl.dataset.pin : null
        }
      } : { placed: false };
    });
    var data = {
      stageId: currentStage.id,
      code: codeEditor.value,
      components: componentsData,
      nickname: nicknameInput.value.trim(),
      createdAt: Date.now()
    };
    setStatus("저장 중...");
    storage.save(data).then(function (id) {
      var name = "PICO-" + id.toUpperCase().slice(0, 4);
      var url = location.origin + location.pathname + "?id=" + id;
      history.replaceState(null, "", "?id=" + id);
      shareWorkName.textContent = (data.nickname || name) + " 저장됨:";
      shareLinkInput.value = url;
      shareBanner.classList.remove("hidden");
      log("저장 완료! 공유 링크: " + url, "ok");
      setStatus("저장됨");
    }).catch(function () {
      log("저장하지 못했습니다.\n현재 작업은 그대로 유지됩니다.\n네트워크 연결을 확인한 뒤 다시 시도하세요.", "err");
      setStatus("저장 실패", "error");
    });
  }

  function restoreFromData(data) {
    var stageIdx = STAGES.findIndex(function (s) { return s.id === data.stageId; });
    if (stageIdx === -1) stageIdx = 0;

    currentStageIndex = stageIdx;
    currentStage = STAGES[stageIdx];
    removeAllComponents();
    clearWires();
    buildBoard();
    renderPalette();
    buildCodeBlocks();
    renderStageTabs();
    missionTextEl.innerHTML = currentStage.mission;
    hintTextEl.textContent = currentStage.hintText;

    codeEditor.value = data.code || currentStage.defaultCode;
    nicknameInput.value = data.nickname || "";

    if (data.components) {
      currentStage.components.forEach(function (type) {
        var c = data.components[type];
        if (!c || !c.placed) return;
        var pos = DEFAULT_POS[type] || { x: 260, y: 30 };
        placeComponent(type, pos.x, pos.y);
        if (c.wires) {
          if (c.wires.signal) connectByLabel(type, "signal", c.wires.signal);
          if (c.wires.gnd) connectByLabel(type, "gnd", c.wires.gnd);
        }
      });
    }
    log("공유된 작품을 불러왔어요.", "ok");
  }

  function loadFromUrl() {
    var params = new URLSearchParams(location.search);
    var id = params.get("id");
    if (!id) return;
    storage.load(id).then(function (data) {
      restoreFromData(data);
    }).catch(function () {
      notFoundModal.classList.remove("hidden");
    });
  }

  // ================= events =================
  function trackCursorPos() { lastCursorPos = codeEditor.selectionStart; }
  codeEditor.addEventListener("click", trackCursorPos);
  codeEditor.addEventListener("keyup", trackCursorPos);
  codeEditor.addEventListener("focus", trackCursorPos);
  runBtn.addEventListener("click", runProgram);
  stopBtn.addEventListener("click", stopProgram);
  resetBtn.addEventListener("click", resetCurrentStage);
  gradeBtn.addEventListener("click", gradeCode);
  saveBtn.addEventListener("click", saveWork);
  copyShareBtn.addEventListener("click", function () {
    shareLinkInput.select();
    navigator.clipboard && navigator.clipboard.writeText(shareLinkInput.value).catch(function () {});
    log("공유 링크를 복사했어요.");
  });
  restartBtn.addEventListener("click", function () {
    notFoundModal.classList.add("hidden");
    switchStage(0);
  });

  // ================= init =================
  renderStageTabs();
  buildBoard();
  renderPalette();
  buildCodeBlocks();
  missionTextEl.innerHTML = currentStage.mission;
  hintTextEl.textContent = currentStage.hintText;
  codeEditor.value = currentStage.defaultCode;
  clearConsole();
  loadFromUrl();
})();
</script>
